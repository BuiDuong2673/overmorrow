server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Forward WeatherAPI calls to the proxy service (key injected server-side)
    location /api/weatherapi/ {
        proxy_pass http://proxy:3000/;
        proxy_set_header Accept-Encoding "";
    }

    # Serve Flutter web app; fall back to index.html for deep-link paths
    location / {
        try_files $uri $uri/ /index.html;
    }
}
