services:
  proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    environment:
      - WAPI_KEY=${WAPI_KEY}
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - proxy
    restart: unless-stopped
